[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true

[rpc_endpoints]
xlayer = "${XLAYER_MAINNET_RPC}"
xlayer_testnet = "${XLAYER_TESTNET_RPC}"
